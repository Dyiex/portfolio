<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Inbox | Angelo Tindog</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav><div class="bar"><a class="logo" href="index.html">Angelo Tindog</a><div class="links"><a href="index.html">Home</a></div><button class="tbtn" id="theme" type="button" aria-label="Toggle light or dark theme">◐</button></div></nav>
<main class="page">
  <h1>Inbox</h1>
  <section id="login">
    <p class="muted">For the site owner only. Visitors can message me from the home page without an account.</p>
    <p class="alert" id="err" hidden></p>
    <form class="form" id="loginForm">
      <label>Email<input type="email" name="email" required autocomplete="username"></label>
      <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn p" type="submit">Log in</button>
    </form>
  </section>
  <section id="inbox" hidden>
    <p class="muted" id="count"></p>
    <div id="list"></div>
    <button class="btn" id="logout" type="button">Log out</button>
  </section>
</main>
<footer>Diether Angelo C. Tindog · Davao del Norte, Philippines</footer>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
